name: Required CI

# Enforce this workflow by identity using an ORGANIZATION required-workflows
# ruleset, sourced from this repository's protected main branch. Requiring a
# check NAME is not sufficient: a PR can publish a no-op check with that name.
# Ruleset execution supplies trusted YAML while pull_request keeps fork code
# under the normal read-only token, secret, cache, and approval boundaries.
# See docs/required-browser-ci.md for the mandatory activation/negative test.
on:
  pull_request:
    branches:
      - main
    # Review bots edit the PR body while checks run. That is not a source
    # change and must not cancel/restart the expensive verification pipeline.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: required-ci-${{ github.workflow_ref }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    name: required-ci-route
    runs-on: ubuntu-24.04 # github-hosted-required: route is trusted control plane
    timeout-minutes: 10
    outputs:
      browser_engine: ${{ steps.detect.outputs.browser_engine }}
    steps:
      - name: Checkout trusted verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Detect browser-engine paths from the pull request
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/required-ci-files.txt"
          if ! observed_head_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')" || \
            [ "$observed_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Pull-request head changed while reading its file list; running browser verification."
            echo "browser_engine=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$files"; then
            echo "Could not read the pull-request file list; running browser verification."
            echo "browser_engine=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # These guards are themselves the trust boundary. Keep this check in
          # the ruleset-controlled shell so a PR cannot weaken its detector and
          # then classify the detector change as a cheap, unverified edit.
          if grep -Eq '^(\.github/|scripts/)' "$files"; then
            echo "Browser/build control-plane changed; running browser verification."
            echo "browser_engine=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 trusted/scripts/ci/detect_browser_engine_changes.py \
            --event-name pull_request \
            --files-from "$files"

  build-and-test:
    name: required-build-and-test
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      source_repository: ${{ github.event.pull_request.head.repo.full_name }}
      trusted_ref: ${{ github.workflow_sha }}
    # No inherited secrets. The enforced reusable workflow, not the PR's
    # ci-status job or workflow_runs.pull_requests metadata, owns this result.

  browser-runtime:
    name: required-browser-runtime
    needs: route
    if: ${{ needs.route.result == 'success' && needs.route.outputs.browser_engine == 'true' }}
    uses: ./.github/workflows/test-e2e.yml
    with:
      trusted_ref: ${{ github.workflow_sha }}
      ref: ${{ github.event.pull_request.head.sha }}
      test_filter: cmuxUITests/BrowserReliabilityRegressionUITests/testBrowserEngineSmokeRendersEvaluatesScreenshotsAndReopens
      test_timeout: "180"
      job_timeout: "60"
      record_video: false
      runner: ${{ vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15' }}
      verify_browser_runtime: true

  required-ci:
    name: required-ci
    needs:
      - route
      - build-and-test
      - browser-runtime
    if: ${{ always() }}
    runs-on: ubuntu-24.04 # github-hosted-required: trusted result gate must not be redirected
    timeout-minutes: 10
    steps:
      - name: Checkout trusted verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted job results and exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          CI_SHA: ${{ needs.build-and-test.outputs.source_sha }}
          CI_RESULT: ${{ needs.build-and-test.result }}
          BROWSER_REQUIRED: ${{ needs.route.outputs.browser_engine || 'unknown' }}
          BROWSER_RESULT: ${{ needs.browser-runtime.result }}
          ROUTE_RESULT: ${{ needs.route.result }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/ci/verify_required_ci_run.py \
            --expected-sha "$EXPECTED_SHA" \
            --ci-sha "$CI_SHA" \
            --ci-result "$CI_RESULT" \
            --route-result "$ROUTE_RESULT" \
            --browser-required "$BROWSER_REQUIRED" \
            --browser-result "$BROWSER_RESULT"
