# cmux Cloud devbox codex managed defaults (source:
# web/services/vms/images/devbox/codex-managed.toml; baked to
# /etc/codex/managed_config.toml, codex's unix managed-config layer, the
# same idiom as /etc/claude-code/managed-settings.json).
#
# Folder trust only. codex matches these keys EXACTLY against the cwd or its
# git root (no ancestor walk, no env short-circuit) and blocks the TUI on a
# trust screen when neither matches. These entries cover the two HOMEs a
# session can start in (root for cmux-tui sessions and exec, ubuntu for the
# desktop and SSH). Any other directory, such as a cloned repo, is trusted per
# launch by the codex() wrapper in agent-config.sh. Approval and sandbox
# policy are left to codex's defaults and the user's flags.
[projects."/root"]
trust_level = "trusted"

[projects."/home/ubuntu"]
trust_level = "trusted"
