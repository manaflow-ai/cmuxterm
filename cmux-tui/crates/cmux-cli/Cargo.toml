[package]
name = "cmux-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust cmux CLI compatibility implementation"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cmux"
path = "src/bin/cmux.rs"

[[bin]]
name = "coderouter"
path = "src/bin/coderouter.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
